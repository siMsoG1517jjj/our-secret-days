
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Secret Days ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,sans-serif;background:#222}
button,input{font:inherit}
button{border:0;cursor:pointer}
#app{max-width:550px;margin:auto;min-height:100dvh}
.wall{min-height:100dvh;background:linear-gradient(145deg,#aaa096,#5e5054 55%,#29232d);color:white;padding:20px;position:relative}
.status{display:flex;justify-content:space-between;font-weight:bold}
.center{text-align:center;padding-top:65px}
.clock{font-size:80px;font-weight:200}
.glass{background:#ffffff40;border-radius:24px;padding:20px;margin-top:25px}
.bottom{position:absolute;bottom:55px;left:0;right:0;text-align:center}
.soft{background:#ffffff44;color:white;border-radius:25px;padding:13px 25px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:300px;margin:35px auto}
.keys button{width:78px;height:78px;border-radius:50%;font-size:32px;background:#ffffff40;color:white}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 8px;margin-top:40px;text-align:center}
.apps button{background:none;color:white;font-size:12px}
.ico{display:grid;place-items:center;background:white;color:#222;border-radius:18px;width:65px;height:65px;margin:auto auto 7px;font-size:32px}
.page{background:white;min-height:100dvh}
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid #eee}
.bar button{background:none;font-size:24px}
.person{width:100%;display:flex;gap:15px;text-align:left;background:white;padding:20px;border-bottom:1px solid #eee}
.avatar{font-size:28px;background:#d0dbe3;border-radius:18px;padding:13px}
.sub{font-size:13px;color:#888}
.chat{height:calc(100dvh - 65px);display:flex;flex-direction:column;background:#b3c7d8}
.messages{flex:1;overflow:auto;padding:15px}
.bubble{white-space:pre-wrap;max-width:82%;width:max-content;padding:12px;border-radius:12px;margin:10px 0;line-height:1.5;overflow-wrap:anywhere}
.j{background:white;margin-right:auto}
.me{background:#ffe55d;margin-left:auto}
.day{text-align:center;color:#61778b;font-size:12px;margin:18px}
.composer{display:flex;gap:8px;background:white;padding:10px}
.composer input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:8px}
.composer button{background:#ffe55d;border-radius:8px;padding:12px}
.hint{text-align:center;font-size:12px;color:#61778b;padding:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById("app");
const KEY="secret-days-jake-story";

const beginning=[
["j","오늘 일 끝났어?","10월 22일"],
["me","응! 이제 집 가"],
["j","조심히 들어가. 집 가면 연락해 ㅎㅎ"],
["me","보고 싶다"],
["j","나도. 다음에 만나면 오래 같이 있자"],
["j","미안 오늘도 전화 못 할 것 같아. 연습이 늦게 끝났어.","10월 26일"],
["me","알겠어"],
["j","왜 이렇게 말이 없어? 무슨 일 있어?","10월 28일"],
["me","요즘 우리 좀 달라진 것 같아"],
["j","…무슨 뜻이야?"],
["j","내가 요즘 연락 잘 못 한 거 알아."],
["j","우리 얘기 좀 하자. 나 피하지 않을게."]
];

let story;
try{story=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!story||!Array.isArray(story.messages)){
story={messages:beginning.map(x=>[...x]),stage:0,done:false};
}
let pinCode="";

function save(){localStorage.setItem(KEY,JSON.stringify(story))}
function clean(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}
function status(){
return '<div class="status"><span>11:15</span><span>▮▮▮ ◕ ▰</span></div>';
}
function lock(){
app.innerHTML=`<div class="wall">${status()}
<div class="center">🔒
<div style="font-size:21px;margin-top:15px">10월 28일 수요일</div>
<div class="clock">11:15</div></div>
<div class="glass">💬 심재윤 · 지금
<div style="margin-top:7px">우리 얘기 좀 하자. 나 피하지 않을게.</div></div>
<div class="bottom"><button class="soft" onclick="pin()">위로 쓸어올려서 열기 ↑</button></div>
</div>`;
}
function pin(){
pinCode="";
app.innerHTML=`<div class="wall">${status()}
<div class="center"><h2>🔒<br>암호 입력</h2>
<div id="dots" style="font-size:30px;letter-spacing:10px">○○○○</div>
<div class="keys">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n=>
n===""?"<span></span>":`<button data-num="${n}">${n}</button>`
).join("")}</div>
<div id="error">비밀번호 4자리</div>
<button class="soft" onclick="lock()" style="margin-top:25px">취소</button>
</div></div>`;
document.querySelectorAll("[data-num]").forEach(b=>{
b.onclick=()=>digit(b.dataset.num);
});
}
function digit(n){
pinCode=n==="⌫"?pinCode.slice(0,-1):pinCode+n;
document.getElementById("dots").textContent=
"●".repeat(pinCode.length)+"○".repeat(4-pinCode.length);
if(pinCode.length===4){
if(pinCode==="1115")home();
else{
pinCode="";
document.getElementById("error").textContent="암호가 틀렸습니다";
document.getElementById("dots").textContent="○○○○";
}
}
}
function home(){
app.innerHTML=`<div class="wall">${status()}
<div class="glass" style="margin-top:55px">
💗 재윤이 & 레이
<div style="margin-top:12px">함께한 지</div>
<b style="font-size:65px">599</b> 일
<div>600일까지 1일 남음</div></div>
<div class="apps">
${[
["💬","카카오톡","chats"],
["📷","Instagram","other"],
["📝","메모","memo"],
["📅","캘린더","other"],
["🖼️","사진","other"],
["⚙️","설정","settings"]
].map(a=>`<button onclick="${a[2]}()">
<div class="ico">${a[0]}</div>${a[1]}</button>`).join("")}
</div>
<div class="bottom"><button class="soft" onclick="lock()">🔒 잠금</button></div>
</div>`;
}
function chats(){
let people=[
["🐶","심재윤",story.messages.at(-1)[1]],
["🐱","양정원","요즘 날도 좋은데"],
["👩","엄마","재윤이가 고기 좋아하잖아~"],
["🎵","박종성","야 너 이름만 부르면서 운다 ㅋㅋ"]
];
app.innerHTML=`<div class="page">${status()}
<div class="bar"><button onclick="home()">‹</button>
<b style="font-size:25px">채팅</b><span>⌕</span></div>
${people.map((p,i)=>`<button class="person" onclick="${i===0?'chat()':'other()'}">
<span class="avatar">${p[0]}</span>
<span><b>${p[1]}</b><br><span class="sub">${clean(p[2]).slice(0,45)}</span></span>
</button>`).join("")}</div>`;
}
function chat(){
app.innerHTML=`<div class="page">
<div class="bar"><button onclick="chats()">‹</button>
<b>심재윤 🐶</b><button onclick="settings()">⋯</button></div>
<div class="chat">
<div class="messages" id="messages"></div>
<div class="hint" id="hint"></div>
<form class="composer" id="form">
<input id="message" placeholder="메시지 입력 / 日本語もOK" ${story.done?"disabled":""}>
<button ${story.done?"disabled":""}>전송</button>
</form></div></div>`;
document.getElementById("form").onsubmit=send;
document.getElementById("hint").innerHTML=story.done?
'화해의 밤 ♡ <button onclick="restart()">最初から</button>':
"ジェイクにメッセージを送ってみて ♡";
render();
}
function render(){
let day="";
const area=document.getElementById("messages");
area.innerHTML=story.messages.map(m=>{
let heading="";
if(m[2]&&m[2]!==day){
day=m[2];
heading=`<div class="day">${clean(day)}</div>`;
}
return heading+`<div class="bubble ${m[0]==="me"?"me":"j"}">${clean(m[1])}</div>`;
}).join("");
area.scrollTop=area.scrollHeight;
}
function send(e){
e.preventDefault();
const input=document.getElementById("message");
const value=input.value.trim();
if(!value||story.done)return;
story.messages.push(["me",value]);
input.value="";
input.disabled=true;
save();
render();
document.getElementById("hint").textContent="재윤이가 입력 중…";
setTimeout(()=>reply(value),1100);
}
function reply(value){
let answer="";
let s=story.stage;

if(/別れ|別れる|헤어|終わり/.test(value)){
answer="그렇게까지 힘들었구나. 내가 너무 늦게 알았어. 지금 당장 대답하라고 안 할게.";
story.stage=2;
}
else if(/時間|考え|잠깐|距離|待って/.test(value)){
answer="응, 알겠어. 기다릴게. 그래도 우리 꼭 다시 얘기하자.";
story.stage=Math.max(s,1);
}
else if(s===0){
if(/寂|さみ|외로|서운|悲|つら|辛|我慢/.test(value)){
answer="그동안 혼자 참았어? 미안해. 바쁘다는 말로 네 마음을 너무 당연하게 생각했어.";
}else if(/怒|嫌|ひど|화나|싫/.test(value)){
answer="화난 거 이해해. 변명하려는 거 아니야. 내가 연락 못 한 게 반복됐잖아.";
}else{
answer="나도 요즘 우리가 멀어진 것 같아서 신경 쓰였어. 네 마음을 듣고 싶어.";
}
story.stage=1;
}
else if(s===1){
answer=/ごめ|미안/.test(value)?
"네가 미안해할 일 아니야. 나도 더 솔직하게 말했어야 했어.":
"말만 하면 소용없다는 거 알아. 앞으로는 바쁠 때도 먼저 연락할게.";
story.stage=2;
}
else if(s===2){
answer=/好き|愛|사랑|会いた|보고 싶/.test(value)?
"나도 사랑해. 보고 싶었어. 다음에 만나면 핸드폰 내려놓고 오래 얘기하자.":
"나 너랑 헤어지고 싶은 거 아니야. 다시 천천히 맞춰 가자. 괜찮겠어?";
story.stage=3;
}
else{
answer="고마워. 그리고 미안했어. 사랑해, 레이. 내일은 내가 먼저 연락할게. 잘 자 ♡";
story.done=true;
}
story.messages.push(["j",answer]);
save();
chat();
}
function restart(){
if(confirm("最初からやり直す？")){
story={messages:beginning.map(x=>[...x]),stage:0,done:false};
save();
chat();
}
}
function memo(){
app.innerHTML=`<div class="page">
<div class="bar"><button onclick="home()">‹</button><b>메모</b></div>
<div style="padding:25px;line-height:2">
まだ送れなかった本音。<p>忙しいのは分かってる。
でも、前みたいに寝る前に少しだけ声が聞きたかった。</p>
</div></div>`;
}
function settings(){
app.innerHTML=`<div class="page">
<div class="bar"><button onclick="home()">‹</button><b>설정</b></div>
<div style="padding:25px">Our Secret Days ♡
<p>これは創作チャットです。会話はこのブラウザに保存されます。</p>
<button onclick="restart()">会話を最初からやり直す</button>
</div></div>`;
}
function other(){
app.innerHTML=`<div class="page">
<div class="bar"><button onclick="home()">‹</button><b>앱</b></div>
<div style="padding:25px">このアプリは準備中だよ ♡</div></div>`;
}
lock();
</script>
  
<style>
.ig{background:#fff;color:#111;min-height:100dvh;padding-bottom:75px;font-family:-apple-system,sans-serif}
.ig *{box-sizing:border-box}
.ig button{background:none;color:inherit;border:0;cursor:pointer}
.ighead{height:55px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;font-size:21px;font-weight:700}
.ighead button{font-size:23px}
.ignav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(550px,100%);height:65px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;z-index:20}
.ignav button{font-size:25px}
.igavatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#eee}
.igbig{width:85px;height:85px}
.igline{display:flex;align-items:center;gap:12px;padding:12px}
.igmuted{color:#888;font-size:12px}
.igbtn{background:#eee!important;border-radius:8px;padding:9px 14px;font-weight:600}
.igblue{background:#3897f0!important;color:white!important}
.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.iggrid img{width:100%;aspect-ratio:1;object-fit:cover}
.igpost{border-bottom:1px solid #eee;margin-bottom:12px}
.igpost>img{width:100%;max-height:520px;object-fit:cover;background:#eee}
.igactions{padding:9px 12px;font-size:24px;display:flex;gap:16px}
.igcaption{padding:3px 13px 10px;font-size:14px}
.igcomment{padding:4px 13px;font-size:13px}
.iginput{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
.iginput input{flex:1;min-width:0;padding:10px;border:1px solid #eee;border-radius:20px}
.iginput button{color:#3897f0;font-weight:600}
.igbubble{padding:11px 15px;border-radius:18px;background:#eee;margin:10px 14px;max-width:78%;width:max-content;white-space:pre-wrap}
.igmine{background:#3897f0;color:white;margin-left:auto}
.igfield{display:block;width:100%;border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
.igstories{display:flex;gap:14px;overflow-x:auto;padding:15px 10px}
.igstories button{min-width:70px;font-size:11px;text-align:center}
.igstories img{width:65px;height:65px;border-radius:50%;object-fit:cover;border:3px solid #dd6e98}
</style>
<script>
const IG_REPO="siMsoG1517jjj/our-secret-days";
const IG_NAMES=["rei_","jakesim","yangjungwon_","simplyjjong","sunoo._.03","nikiiii","jay"];
const IG_DISPLAY=["레이","심재윤","양정원","박성훈","선우","니키","박종성"];
const IG_KEY="our-secret-instagram-v1";
const igDefault={
 username:"rei_",name:"레이",bio:"♡ jakesim",
 avatar:9,following:[1,2,3,4,5,6],
 removed:[],likes:[],comments:{},dm:{},extra:[]
};
let igState;
try{igState=JSON.parse(localStorage.getItem(IG_KEY))||igDefault}catch(e){igState=igDefault}
let igImages=[],igPage="feed",igPerson=0,igPostId="",igChatTo=1,igListType="followers",igListOwner=0;
function igSave(){localStorage.setItem(IG_KEY,JSON.stringify(igState))}
function igName(i){return i===0?igState.username:IG_NAMES[i]}
function igDisplay(i){return i===0?igState.name:IG_DISPLAY[i]}
function igPhoto(n){return igImages[n%Math.max(igImages.length,1)]||""}
function igAvatar(i){
 const n=i===0?igState.avatar:[9,7,2,3,1,5,0][i];
 return igPhoto(n);
}
function igImage(url,cls="igavatar"){
 return url?`<img class="${cls}" src="${clean(url)}">`:`<span class="${cls}">♡</span>`;
}
function igHeader(t){
 return `<div class="ighead"><button onclick="igBack()">‹</button><span>${clean(t)}</span><button onclick="igOpen('dmList')">✉</button></div>`;
}
function igNav(){
 return `<div class="ignav">
 <button onclick="home()">⌂</button>
 <button onclick="igOpen('feed')">◎</button>
 <button onclick="igOpen('dmList')">✉</button>
 <button onclick="igOpen('photos')">▦</button>
 <button onclick="igProfile(0)">${igImage(igAvatar(0))}</button>
 </div>`;
}
function igOpen(p){igPage=p;igRender()}
function igBack(){
 if(igPage==="post")igProfile(igPerson);
 else if(igPage==="dm")igOpen("dmList");
 else if(igPage==="list")igProfile(igListOwner);
 else if(igPage==="edit")igProfile(0);
 else if(igPage==="profile")igOpen("feed");
 else home();
}
function igProfile(i){igPerson=i;igOpen("profile")}
function igPosts(){
 let all=[];
 const sets=[[4,5,6,9],[7,0,8,3,5,6],[2,4],[3,6],[1,5],[5,8],[0,7]];
 for(let i=0;i<7;i++)sets[i].forEach((im,n)=>{
  const id=i+"-"+n;
  if(!igState.removed.includes(id))all.push({
   id,owner:i,im,caption:[
    "우리의 하루 ♡","좋았던 날","기억하고 싶은 순간",
    "다음에 또 가자","☁️","오늘도 행복하게"
   ][(i+n)%6],time:100-i*8-n*10
  });
 });
 return [...igState.extra,...all].sort((a,b)=>b.time-a.time);
}
function igPostCard(p){
 const liked=igState.likes.includes(p.id);
 const comments=igState.comments[p.id]||[];
 const starter=p.owner===0
  ?`<div class="igcomment"><b>jakesim</b> 귀엽네 ㅎㅎ ❤️</div>`
  :p.owner===1
  ?`<div class="igcomment"><b>${clean(igName(0))}</b> 보고 싶어 🥹</div><div class="igcomment"><b>yangjungwon_</b> ㅋㅋㅋㅋ</div>`
  :`<div class="igcomment"><b>jakesim</b> ㅋㅋㅋ 좋아</div>`;
 return `<div class="igpost">
 <div class="igline">
 ${igImage(igAvatar(p.owner))}
 <button onclick="igProfile(${p.owner})"><b>${clean(igName(p.owner))}</b></button>
 <span style="flex:1"></span>
 ${p.owner===0?`<button onclick="igDelete('${p.id}')">⋯</button>`:""}
 </div>
 ${igImage(igPhoto(p.im),"igphoto")}
 <div class="igactions">
 <button onclick="igLike('${p.id}')">${liked?"❤️":"♡"}</button>
 <button onclick="igShowPost('${p.id}')">♧</button>
 <button onclick="igDM(${p.owner===0?1:p.owner})">✉</button>
 </div>
 <div class="igcaption"><b>${clean(igName(p.owner))}</b> ${clean(p.caption)}</div>
 ${starter}
 ${comments.map(c=>`<div class="igcomment"><b>${clean(c.by)}</b> ${clean(c.text)}</div>`).join("")}
 <div class="iginput">
 <input id="igc${p.id}" placeholder="댓글 달기...">
 <button onclick="igComment('${p.id}')">게시</button>
 </div></div>`;
}
function igLike(id){
 igState.likes=igState.likes.includes(id)?
 igState.likes.filter(x=>x!==id):[...igState.likes,id];
 igSave();igRender();
}
function igComment(id){
 const el=document.getElementById("igc"+id),v=el?.value.trim();
 if(!v)return;
 (igState.comments[id]??=[]).push({by:igName(0),text:v});
 igSave();igRender();
}
function igDelete(id){
 if(!confirm("この投稿を削除する？"))return;
 igState.removed.push(id);
 igState.extra=igState.extra.filter(p=>p.id!==id);
 igSave();igOpen("profile");
}
function igShowPost(id){igPostId=id;igOpen("post")}
function igFollow(i){
 if(i===0)return;
 igState.following=igState.following.includes(i)?
 igState.following.filter(x=>x!==i):[...igState.following,i];
 igSave();igRender();
}
function igList(i,type){
 igListOwner=i;igListType=type;igOpen("list");
}
function igDM(i){igChatTo=i;igOpen("dm")}
function igSendDM(){
 const el=document.getElementById("igmessage"),v=el?.value.trim();
 if(!v)return;
 const msgs=igState.dm[igChatTo]??=[];
 msgs.push({mine:true,text:v});
 const replies=igChatTo===1?
 ["응, 보고 있었어. 무슨 일이야?","ㅋㅋ 귀엽네","오늘 뭐 했어?","나도 보고 싶었어."]:
 ["ㅋㅋㅋ","맞아!","고마워 😄"];
 msgs.push({mine:false,text:replies[(msgs.filter(x=>x.mine).length-1)%replies.length]});
 igState.dm[igChatTo]=msgs;igSave();igRender();
}
function igSaveProfile(){
 igState.username=document.getElementById("igusername").value.trim().replace(/[^a-zA-Z0-9._]/g,"")||"rei_";
 igState.name=document.getElementById("igname").value.trim()||"레이";
 igState.bio=document.getElementById("igbio").value;
 igState.avatar=Number(document.getElementById("igavatar").value);
 igSave();igProfile(0);
}
function igAddPost(){
 const im=Number(document.getElementById("ignewphoto").value);
 const caption=document.getElementById("ignewcaption").value;
 igState.extra.push({id:"x"+Date.now(),owner:0,im,caption,time:Date.now()});
 igSave();igProfile(0);
}

function igPeople(arr){
 return arr.map(i=>`<div class="igline" data-person="${clean(igName(i).toLowerCase())}">
 <button onclick="igProfile(${i})">${igImage(igAvatar(i))}</button>
 <div style="flex:1" onclick="igProfile(${i})"><b>${clean(igName(i))}</b><div class="igmuted">${clean(igDisplay(i))}</div></div>
 ${i===0?"":`<button class="igbtn ${igState.following.includes(i)?"":"igblue"}" onclick="igFollow(${i})">${igState.following.includes(i)?"팔로잉":"팔로우"}</button>`}
 </div>`).join("");
}
function igFilterPeople(q){
 document.querySelectorAll("[data-person]").forEach(el=>{
 el.style.display=el.dataset.person.includes(q.toLowerCase())?"flex":"none";
 });
}
function igPhotoView(i){igPostId=i;igOpen("photoView")}
async function igLoadImages(){
 try{
 const r=await fetch("https://api.github.com/repos/"+IG_REPO+"/contents/");
 if(!r.ok)throw Error("画像の取得に失敗");
 const files=await r.json();
 igImages=files.filter(f=>f.type==="file"&&/\.(jpg|jpeg|png|webp|gif)$/i.test(f.name))
 .sort((a,b)=>a.name.localeCompare(b.name))
 .map(f=>f.download_url);
 }catch(e){console.warn(e)}
}
